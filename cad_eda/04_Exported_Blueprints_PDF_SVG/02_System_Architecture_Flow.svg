      .node-txt { font-family: "Segoe UI", Arial, sans-serif; font-size: 1.7px; fill: #E2E8F0; }
      .node-sub { font-family: "Segoe UI", Arial, sans-serif; font-size: 1.4px; fill: #94A3B8; }
